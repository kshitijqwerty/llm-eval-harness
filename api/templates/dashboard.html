<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Eval Harness</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f; --surface:#111118; --border:#1e1e2e;
    --accent:#00ff88; --danger:#ff4466; --warn:#ffaa00;
    --text:#e0e0f0; --muted:#555570; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:40px 24px;}
  .wrap{max-width:1040px;margin:0 auto;}

  header{border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:32px;display:flex;align-items:flex-end;justify-content:space-between;}
  .brand .tag{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px;}
  .brand h1{font-size:22px;font-weight:600;}

  .layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start;}

  /*  Runs table  */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
  .panel-head h2{font-size:13px;font-weight:600;flex:1;}
  .panel-head input{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:6px;font-size:12px;font-family:var(--mono);width:180px;}
  .panel-head input:focus{outline:none;border-color:var(--accent);}

  table{width:100%;border-collapse:collapse;}
  thead th{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:9px 14px;text-align:left;border-bottom:1px solid var(--border);}
  tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
  tbody tr:hover{background:#ffffff06;}
  td{padding:11px 14px;font-size:13px;}
  .mono{font-family:var(--mono);}
  .muted{color:var(--muted);}
  .pass{color:var(--accent);}
  .fail{color:var(--danger);}
  .badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;}
  .badge.pass{background:#00ff8815;color:var(--accent);border:1px solid #00ff8830;}
  .badge.fail{background:#ff446615;color:var(--danger);border:1px solid #ff446630;}

  /*  Right sidebar  */
  .sidebar{display:flex;flex-direction:column;gap:16px;}

  /*  Trigger card  */
  .trigger-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
  .trigger-card h2{font-size:13px;font-weight:600;margin-bottom:12px;}
  .trigger-card input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;font-family:var(--mono);margin-bottom:10px;}
  .trigger-card input:focus{outline:none;border-color:var(--accent);}
  .btn{width:100%;padding:9px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:opacity .15s;}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-primary:hover{opacity:.88;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}

  /* ── Jobs feed ── */
  .jobs-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .jobs-card-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
  .jobs-card-head h2{font-size:13px;font-weight:600;flex:1;}
  .jobs-list{max-height:420px;overflow-y:auto;}
  .job-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;}
  .job-item:last-child{border-bottom:none;}
  .job-item:hover{background:#ffffff06;}
  .job-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .job-path{font-family:var(--mono);font-size:11px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .job-time{font-family:var(--mono);font-size:10px;color:var(--muted);}
  .job-logs{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;margin-top:6px;display:none;}
  .job-item.expanded .job-logs{display:block;}
  .log-line{padding:1px 0;}
  .log-line.err{color:var(--danger);}

  /* status dot */
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot.running{background:var(--warn);animation:pulse 1s infinite;}
  .dot.done{background:var(--accent);}
  .dot.failed{background:var(--danger);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /*  Detail modal  */
  .overlay{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;}
  .overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:580px;max-height:80vh;overflow-y:auto;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .modal-head h2{font-size:15px;font-weight:600;}
  .close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  .close-btn:hover{color:var(--text);}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
  .stat{background:var(--bg);border-radius:6px;padding:10px 12px;}
  .stat-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;}
  .stat-val{font-family:var(--mono);font-size:18px;font-weight:600;}
  .report-link{display:inline-block;margin-top:14px;font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;}
  .report-link:hover{text-decoration:underline;}

  /* scrollbar */
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="tag">LLM Eval Harness</div>
      <h1>Dashboard</h1>
    </div>
    <span id="hdr-status" style="font-family:var(--mono);font-size:11px;color:var(--muted)"></span>
  </header>

  <div class="layout">

    <!-- Left: runs table -->
    <div class="panel">
      <div class="panel-head">
        <h2>Eval runs</h2>
        <input id="task-filter" placeholder="Filter by task..." oninput="loadRuns()">
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Task</th><th>Mode</th><th>Date</th>
            <th>Hallucination</th><th>Faithfulness</th><th>Cases</th><th>CI</th>
          </tr>
        </thead>
        <tbody id="runs-tbody">
          <tr><td colspan="8" style="padding:20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Right: trigger + jobs -->
    <div class="sidebar">

      <div class="trigger-card">
        <h2>Trigger eval run</h2>
        <input id="trigger-path" value="evals/tasks/sample_rag.yaml" placeholder="YAML task path">
        <button class="btn btn-primary" id="trigger-btn" onclick="triggerRun()">▶ Run eval</button>
      </div>

      <div class="jobs-card">
        <div class="jobs-card-head">
          <h2>Background jobs</h2>
          <span id="running-count" style="font-family:var(--mono);font-size:11px;color:var(--muted)"></span>
        </div>
        <div class="jobs-list" id="jobs-list">
          <div style="padding:16px;font-family:var(--mono);font-size:11px;color:var(--muted)">No jobs yet</div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Detail modal -->
<div class="overlay" id="detail-overlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Run detail</h2>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let prevRunningIds = new Set();

/*  Runs table  */
async function loadRuns() {
  const task = document.getElementById('task-filter').value.trim();
  const url  = '/runs' + (task ? '?task=' + encodeURIComponent(task) : '');
  const runs = await fetch(url).then(r => r.json()).catch(() => []);
  document.getElementById('hdr-status').textContent = runs.length + ' runs';

  const tbody = document.getElementById('runs-tbody');
  if (!runs.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--muted);font-family:var(--mono);font-size:12px;">No runs yet</td></tr>';
    return;
  }
  tbody.innerHTML = runs.map(r => `
    <tr onclick="loadDetail(${r.id})">
      <td class="mono muted">#${r.id}</td>
      <td>${r.task_name}</td>
      <td class="mono muted">${r.mode}</td>
      <td class="mono muted">${r.created_at.slice(0,16).replace('T',' ')}</td>
      <td class="mono ${r.avg_hallucination > 0.25 ? 'fail' : 'pass'}">${r.avg_hallucination.toFixed(2)}</td>
      <td class="mono">${r.avg_faithfulness.toFixed(2)}</td>
      <td class="mono">${r.passed_cases}/${r.total_cases}</td>
      <td><span class="badge ${r.ci_passed ? 'pass' : 'fail'}">${r.ci_passed ? 'PASS' : 'FAIL'}</span></td>
    </tr>`).join('');
}

/*  Jobs feed  */
async function loadJobs() {
  const jobs = await fetch('/jobs').then(r => r.json()).catch(() => []);
  const runningIds = new Set(jobs.filter(j => j.status === 'running').map(j => j.id));

  /* if a job just finished, refresh the runs table */
  const justFinished = [...prevRunningIds].some(id => !runningIds.has(id));
  if (justFinished) loadRuns();
  prevRunningIds = runningIds;

  const count = runningIds.size;
  document.getElementById('running-count').textContent = count ? count + ' running' : '';

  const btn = document.getElementById('trigger-btn');
  btn.disabled = count > 0;
  btn.textContent = count > 0 ? '⏳ Running…' : '▶ Run eval';

  const list = document.getElementById('jobs-list');
  if (!jobs.length) {
    list.innerHTML = '<div style="padding:16px;font-family:var(--mono);font-size:11px;color:var(--muted)">No jobs yet</div>';
    return;
  }

  list.innerHTML = jobs.slice(0, 12).map(j => {
    const logs = (j.log_tail || []).map(l => {
      const isErr = /error|fail|exception/i.test(l);
      const clean = l.replace(/\x1b\[[0-9;]*m/g, '');   /* strip ANSI */
      return `<div class="log-line ${isErr ? 'err' : ''}">${esc(clean)}</div>`;
    }).join('');

    const dur = j.finished_at
      ? ((new Date(j.finished_at) - new Date(j.started_at)) / 1000).toFixed(1) + 's'
      : elapsed(j.started_at);

    return `
      <div class="job-item" id="job-${j.id}" onclick="toggleJob('${j.id}')">
        <div class="job-row">
          <div class="dot ${j.status}"></div>
          <span class="job-path">${esc(j.task_path)}</span>
          <span class="job-time">${dur}</span>
        </div>
        <div class="job-logs">${logs || '<div class="log-line muted">No output yet</div>'}</div>
      </div>`;
  }).join('');
}

function toggleJob(id) {
  document.getElementById('job-' + id)?.classList.toggle('expanded');
}

function elapsed(iso) {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  return s < 60 ? s + 's' : Math.floor(s/60) + 'm ' + (s%60) + 's';
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/*  Trigger  */
async function triggerRun() {
  const path = document.getElementById('trigger-path').value.trim();
  if (!path) return;
  const btn = document.getElementById('trigger-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Starting…';
  await fetch('/trigger', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({task_path: path}),
  });
  loadJobs();
}

/*  Detail modal  */
async function loadDetail(id) {
  const [run, results] = await Promise.all([
    fetch(`/runs/${id}`).then(r => r.json()),
    fetch(`/runs/${id}/results`).then(r => r.json()),
  ]);
  document.getElementById('modal-title').textContent = `Run #${id} — ${run.task_name}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="stat-grid">
      ${[['Hallucination', run.avg_hallucination.toFixed(2)],
         ['Faithfulness',  run.avg_faithfulness.toFixed(2)],
         ['Relevance',     run.avg_relevance.toFixed(2)],
         ['Avg latency',   run.avg_latency_ms.toFixed(0)+'ms'],
        ].map(([l,v])=>`<div class="stat"><div class="stat-lbl">${l}</div><div class="stat-val">${v}</div></div>`).join('')}
    </div>
    <table>
      <thead><tr><th>Case</th><th>Model</th><th>Hall</th><th>Faith</th><th>Status</th></tr></thead>
      <tbody>${results.map(r=>`
        <tr>
          <td class="mono muted">${r.case_id}</td>
          <td class="mono" style="font-size:11px;color:var(--muted)">${r.model_id}</td>
          <td class="mono ${r.hallucination>0.25?'fail':'pass'}">${r.hallucination.toFixed(2)}</td>
          <td class="mono">${r.faithfulness.toFixed(2)}</td>
          <td><span class="badge ${r.passed?'pass':'fail'}">${r.passed?'PASS':'FAIL'}</span></td>
        </tr>`).join('')}
      </tbody>
    </table>
    <a class="report-link" href="/runs/${id}/report" target="_blank">Open full HTML report →</a>`;
  document.getElementById('detail-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('detail-overlay').classList.remove('open');
}

document.getElementById('detail-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

/*  Poll  */
loadRuns();
loadJobs();
setInterval(loadJobs, 5000);
setInterval(loadRuns, 30000);
</script>
</body>
</html>
